<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd486"/>
      <stop offset=".55" stop-color="#ddb554"/>
      <stop offset="1" stop-color="#b98f2e"/>
    </linearGradient>
    <radialGradient id="shade" cx="30%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2c08" stop-opacity=".28"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="32" cy="32" r="31"/></clipPath>
  </defs>
  <g clip-path="url(#ball)">
    <rect width="64" height="64" fill="url(#gold)"/>
    <!-- white scallops biting into the rim on the diagonals -->
    <g fill="#fbfaf6">
      <circle cx="3" cy="3" r="16"/>
      <circle cx="61" cy="3" r="16"/>
      <circle cx="3" cy="61" r="16"/>
      <circle cx="61" cy="61" r="16"/>
      <circle cx="32" cy="32" r="20"/>
    </g>
    <rect width="64" height="64" fill="url(#shade)"/>
  </g>
  <circle cx="32" cy="32" r="30.6" fill="none" stroke="#000" stroke-opacity=".12" stroke-width=".8"/>
  <!-- the 6 is drawn as strokes so it looks the same without any font -->
  <g fill="none" stroke="#b8892a" stroke-width="9" stroke-linecap="round" transform="translate(32 32) scale(.56) translate(-32 -32.25)">
    <circle cx="32" cy="39.5" r="10.5"/>
    <path d="M21.5 39.5V26.5C21.5 19 26 14.5 32.5 14.5C36 14.5 38.8 15.8 40.5 18"/>
  </g>
</svg>
