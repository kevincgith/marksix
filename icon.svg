<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#2b2590"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efd486"/>
      <stop offset=".55" stop-color="#ddb554"/>
      <stop offset="1" stop-color="#b98f2e"/>
    </linearGradient>
    <radialGradient id="shade" cx="30%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2c08" stop-opacity=".28"/>
